  <!-- Lock Screen -->
  <div id="lock-screen" class="min-h-screen flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-3xl p-6 sm:p-8 shadow-xl space-y-6">
      <div class="text-center space-y-2">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-600 text-white flex items-center justify-center font-black text-2xl shadow-lg shadow-emerald-500/25">
          🔒
        </div>
        <h1 class="font-extrabold text-lg text-slate-900 dark:text-white">S마을 전용 보안 대시보드</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
          조원 개인정보 및 기도제목 보호를 위해<br><strong>AES-256 암호화</strong>가 적용되어 있습니다.
        </p>
      </div>

      <form id="unlock-form" onsubmit="handleUnlock(event)" class="space-y-4">
        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">아이디 (ID)</label>
          <input type="text" id="auth-id" required autocomplete="username" placeholder="아이디 입력" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <div class="space-y-1.5">
          <label class="block text-xs font-bold text-slate-700 dark:text-slate-300">비밀번호 (Password)</label>
          <div class="relative">
            <input type="password" id="auth-pw" required autocomplete="current-password" placeholder="비밀번호 입력" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-sm text-slate-900 dark:text-white focus:outline-none focus:ring-2 focus:ring-emerald-500 pr-10">
            <button type="button" onclick="togglePwVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs" id="pw-eye-btn">👁️</button>
          </div>
        </div>

        <div class="flex items-center justify-between pt-1">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input type="checkbox" id="auth-remember" checked class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500">
            <span class="text-xs text-slate-600 dark:text-slate-400 font-medium">이 기기에서 자동 잠금해제 유지</span>
          </label>
        </div>

        <div id="auth-error" class="hidden p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-800 text-xs text-rose-600 dark:text-rose-300 font-semibold text-center">
          🚨 아이디 또는 비밀번호가 일치하지 않습니다.
        </div>

        <button type="submit" id="unlock-btn" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow-md shadow-emerald-600/20 transition-all flex items-center justify-center gap-2">
          <span>🔓</span> <span>잠금 해제하기</span>
        </button>
      </form>

      <div class="pt-3 border-t border-slate-100 dark:border-slate-800 text-center">

    const STORAGE_KEY = 'smaul_aes_cred_v1';

    function togglePwVisibility() {
      const pwInput = document.getElementById('auth-pw');
      const eyeBtn = document.getElementById('pw-eye-btn');
      if (pwInput.type === 'password') {
        pwInput.type = 'text';
        eyeBtn.innerText = '🙈';
      } else {
        pwInput.type = 'password';
        eyeBtn.innerText = '👁️';
      }
    }

    function base64ToUint8Array(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
      return arr;
    }

    async function decryptPayload(credentialStr) {
      const enc = new TextEncoder();
      const salt = base64ToUint8Array(ENCRYPTED_BUNDLE.salt);
      const iv = base64ToUint8Array(ENCRYPTED_BUNDLE.iv);
      const ciphertext = base64ToUint8Array(ENCRYPTED_BUNDLE.data);

      const baseKey = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(credentialStr),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const aesKey = await window.crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: ENCRYPTED_BUNDLE.iterations,
          hash: 'SHA-256'
        },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decryptedBuf = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        aesKey,
        ciphertext
      );

      const dec = new TextDecoder();
      return JSON.parse(dec.decode(decryptedBuf));
    }

    async function unlockWithCredential(credentialStr, saveRemember) {
      const payload = await decryptPayload(credentialStr);
      if (saveRemember) {
        localStorage.setItem(STORAGE_KEY, credentialStr);
      }
      document.getElementById('lock-screen').classList.add('hidden');
      const appRoot = document.getElementById('app-root');
      appRoot.innerHTML = payload.html;
      appRoot.classList.remove('hidden');

      const s = document.createElement('script');
      s.textContent = payload.js;
      document.body.appendChild(s);
    }

    async function handleUnlock(e) {
      e.preventDefault();
      const idVal = (document.getElementById('auth-id').value || '').trim().toUpperCase();
      const pwVal = (document.getElementById('auth-pw').value || '').trim();
      const remember = document.getElementById('auth-remember').checked;
      const errBox = document.getElementById('auth-error');
      const btn = document.getElementById('unlock-btn');

      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.innerHTML = '<span>⏳</span> <span>복호화 확인 중...</span>';

      try {
        const credStr = idVal + ':' + pwVal;
        await unlockWithCredential(credStr, remember);
      } catch (err) {
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = '<span>🔓</span> <span>잠금 해제하기</span>';
      }
    }

    function lockDashboard() {
      localStorage.removeItem(STORAGE_KEY);
      window.location.reload();
    }

    // Auto-unlock if saved credential exists on this device
    window.addEventListener('DOMContentLoaded', async () => {
      const savedCred = localStorage.getItem(STORAGE_KEY);
      if (savedCred) {
        try {
          await unlockWithCredential(savedCred, false);
        } catch (e) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }
    });
  </script>
